
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">

    <title>Mythoria | My Grimoire</title>
</head>

<body
    class="min-h-screen bg-cover bg-center bg-no-repeat bg-fixed text-white"
    style="background-image: url('./images/Sanctuaire mystique aux chandelles.png');">

  
<header class="fixed top-0 left-0 z-50 flex w-full flex-wrap items-center justify-between gap-4 border-b border-amber-500/30 bg-black px-8 py-4">

    <a href="index.html" class="flex items-center gap-3">
        <img src="images/logo.png" alt="Mythoria logo" class="h-12 w-12 object-contain">
        <span class="text-2xl font-bold text-amber-400">MYTHORIA</span>
    </a>

    <input type="checkbox" id="menu" class="peer hidden">

    <label for="menu" class="cursor-pointer text-3xl text-amber-400 md:hidden">
        ☰
    </label>

    <nav class="hidden w-full peer-checked:block md:block md:w-auto" aria-label="Main navigation">
        <ul class="flex flex-col gap-5 text-white md:flex-row md:items-center md:gap-8">
            <li><a href="index.html" class="hover:text-amber-400">Home</a></li>
            <li><a href="shop.html" class="hover:text-amber-400">Booster Shop</a></li>
            <li><a href="openingChamber.html" class="hover:text-amber-400">Opening Chamber</a></li>
            <li><a href="grimoire.html" class="text-amber-400">My Collection</a></li>
            <li><a href="deck.html" class="hover:text-amber-400">My Deck</a></li>
        </ul>
    </nav>

</header>

    <main class="mx-auto max-w-7xl px-6 pb-12 pt-28">

        <h1 class="mb-8 text-center text-3xl font-bold text-amber-400">
            MY GRIMOIRE
        </h1>

        <div class="grid gap-6 md:grid-cols-[200px_1fr]">

            <div class="h-fit rounded-lg border border-amber-700 bg-[#211910]/95 p-4">

                <h2 class="mb-4 text-xl font-bold text-amber-400">
                    Boosters
                </h2>

                <div class="flex flex-col gap-3">

                    <button
                        class="booster-filter rounded px-3 py-2 text-left hover:bg-amber-500 hover:text-black"
                        data-filter-value="all">
                        All cards
                    </button>

                    <button
                        class="booster-filter rounded px-3 py-2 text-left hover:bg-amber-500 hover:text-black"
                        data-filter-value="standard">
                        Hunter's Journey
                    </button>

                    <button
                        class="booster-filter rounded px-3 py-2 text-left hover:bg-amber-500 hover:text-black"
                        data-filter-value="good">
                        Heaven's Path
                    </button>

                    <button
                        class="booster-filter rounded px-3 py-2 text-left hover:bg-amber-500 hover:text-black"
                        data-filter-value="legendary">
                        King's Awakening
                    </button>

                    <button
                        class="booster-filter rounded px-3 py-2 text-left hover:bg-amber-500 hover:text-black"
                        data-filter-value="phantom">
                        Phantom Troupe
                    </button>

                </div>
            </div>

            <section class="min-w-0 rounded-lg border border-amber-700/50 bg-black/60 p-4">

                <div
                    id="cards-grid"
                    class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
                </div>

            </section>

        </div>

        <section
            id="details"
            hidden
            class="mt-8 rounded-lg border border-amber-700 bg-[#211910]/95 p-6">

            <button
                id="close-details"
                class="mb-4 rounded px-3 py-2 text-amber-400 hover:bg-amber-500 hover:text-black">
                ← Back to collection
            </button>

            <div class="flex flex-col gap-6 sm:flex-row">

                <img
                    id="detail-image"
                    src=""
                    alt="Selected card"
                    class="max-h-96 w-full rounded-lg object-contain sm:w-1/3">

                <div>
                    <h2
                        id="detail-name"
                        class="mb-3 text-2xl font-bold text-amber-400">
                    </h2>

                    <p id="detail-rarity" class="mb-3 capitalize"></p>
                    <p id="detail-description" class="mb-3"></p>
                    <p id="detail-stats"></p>
                </div>

            </div>
        </section>

    </main>

    <script src="grimoire.js"></script>

</body>
</html>
