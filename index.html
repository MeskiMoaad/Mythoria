<body class="min-h-screen bg-cover bg-center bg-no-repeat" style="background-image: url('./images/eclipse.png');">
	<header class="fixed top-0 left-0 z-50 w-full  flex items-center justify-between px-8 py-4 bg-black/50 border-b border-amber-500/30 ">

		<a href="index.html" class="flex items-center gap-3">
			<img src="images/logo.png" alt="Mythoria logo" class="h-12 w-12 object-contain">
			<span class="text-2xl font-bold text-amber-400">

			</span>
		</a>

		<nav aria-label="Main navigation">
			<ul class="flex items-center gap-8 text-white">

				</li>
				<li>

				<li>

				<li>

			</ul>

	<main class=" pt-24 bg-black/70">
		
<section class="px-8 py-16 text-white">

		<div class="flex flex-wrap justify-center items-start gap-4">
 			 <img src="images/chrollo.png" alt="Chrollo Lucilfer" class="w-110 shrink-0 rounded-xl shadow-2xl">
